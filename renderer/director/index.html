<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NicOS Desktop — Director</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="banner">
    <div>
      <div class="title">NicOS Desktop</div>
      <div class="subtitle">Director</div>
    </div>
    <span class="badge" id="server-status">conectando...</span>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab" data-tab="resumen">Resumen</button>
      <button class="tab" data-tab="tareas">Tareas <span id="badge-pending-count"></span></button>
      <button class="tab" data-tab="abate">Abate</button>
      <button class="tab" data-tab="chat">Chat</button>
      <button class="tab" data-tab="ajustes">Ajustes</button>
      <button class="tab" data-tab="acerca-de">Acerca de</button>
    </div>

    <div id="tab-resumen" class="tab-panel"></div>
    <div id="tab-tareas" class="tab-panel" style="display:none;"></div>
    <div id="tab-abate" class="tab-panel" style="display:none;"></div>
    <div id="tab-chat" class="tab-panel" style="display:none;"></div>
    <div id="tab-ajustes" class="tab-panel" style="display:none;"></div>
    <div id="tab-acerca-de" class="tab-panel" style="display:none;"></div>
  </div>

  <script src="../shared/ui-helpers.js"></script>
  <script src="../shared/settings-panel-director.js"></script>
  <script src="../shared/about-panel.js"></script>
  <script src="tasks-tab.js"></script>
  <script src="abate-tab.js"></script>
  <script src="app.js"></script>
</body>
</html>

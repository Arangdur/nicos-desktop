<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NicOS Desktop — ¿Quién sos?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container" style="max-width:520px; margin-top:80px;">
    <div class="card" style="text-align:center;">
      <h3 style="margin-bottom:20px;">NicOS Desktop</h3>
      <p style="color:var(--muted); font-size:14px; margin-bottom:24px;">
        ¿Esta PC es la Mac de Nicolás? Se guarda una sola vez por máquina — se
        puede cambiar después desde Ajustes. Si es otra PC (secretaria,
        enfermería de Abate, etc.), cada persona se identifica después con su
        propio código.
      </p>
      <div style="display:flex; gap:12px; justify-content:center;">
        <button class="primary" id="btn-director">Sí, soy Nicolás (Director)</button>
        <button class="secondary" id="btn-operativa">No, es otra PC</button>
      </div>
    </div>
  </div>
  <script src="selector.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NicOS Desktop — Vincular con la Mac</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="container" style="max-width:480px; margin-top:60px;">
    <div class="card">
      <h3>Vincular esta PC con la Mac de Nicolás</h3>
      <p style="font-size:13px; color:var(--muted); margin-bottom:16px;">
        En la Mac: Director → Ajustes → "Vincular nuevo dispositivo" genera un código de 6 dígitos,
        válido 5 minutos. Pedíselo a Nicolás y escribilo acá.
      </p>
      <label>IP de la Mac en la red local (ej. 192.168.1.4)</label>
      <input type="text" id="mac-host" placeholder="192.168.1.4">
      <label>Puerto (dejalo así salvo que Nicolás te diga otro)</label>
      <input type="text" id="mac-port" value="47500">
      <label>Código de 6 dígitos</label>
      <input type="text" id="pairing-code" maxlength="6" placeholder="000000">
      <label>Nombre de esta PC (para que Nicolás la reconozca en su lista)</label>
      <input type="text" id="device-name" placeholder="PC Consultorio">
      <div id="pairing-status" style="font-size:13px; margin:12px 0;"></div>
      <button class="primary" id="btn-pair">Vincular</button>
    </div>
  </div>
  <script src="pairing.js"></script>
</body>
</html>

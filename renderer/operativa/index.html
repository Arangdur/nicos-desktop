<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>NicOS Desktop — Operativa</title>
  <link rel="stylesheet" href="../shared/styles.css">
</head>
<body>
  <div class="banner">
    <div>
      <div class="title">NicOS Desktop</div>
      <div class="subtitle" id="banner-subtitle">Operativa</div>
    </div>
    <span class="badge" id="server-status">conectando...</span>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="tab" data-tab="entrada">Entrada rápida <span id="badge-outbox"></span></button>
      <button class="tab" data-tab="mensajes">Mensajes</button>
      <button class="tab" data-tab="recordatorios">Recordatorios</button>
      <button class="tab" data-tab="mensajes-whatsapp">Bandeja de WhatsApp</button>
      <button class="tab" data-tab="ajustes">Ajustes</button>
      <button class="tab" data-tab="acerca-de">Acerca de</button>
    </div>

    <div id="tab-entrada" class="tab-panel"></div>
    <div id="tab-mensajes" class="tab-panel" style="display:none;"></div>
    <div id="tab-recordatorios" class="tab-panel" style="display:none;"></div>
    <div id="tab-mensajes-whatsapp" class="tab-panel" style="display:none;"></div>
    <div id="tab-ajustes" class="tab-panel" style="display:none;"></div>
    <div id="tab-acerca-de" class="tab-panel" style="display:none;"></div>
  </div>

  <script src="../shared/ui-helpers.js"></script>
  <script src="../shared/settings-panel-operativa.js"></script>
  <script src="../shared/clinical-guard.js"></script>
  <script src="../shared/about-panel.js"></script>
  <script src="entrada-rapida.js"></script>
  <script src="recordatorios-avisos.js"></script>
  <script src="mensajes-whatsapp-tab.js"></script>
  <script src="app.js"></script>
</body>
</html>

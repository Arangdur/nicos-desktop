name: Build Windows installer

# Se dispara manualmente o al pushear a main. No se puede compilar el .exe de forma
# confiable desde macOS (módulos nativos de Node y el binario de PyInstaller deben
# construirse en el mismo SO destino) — por eso este workflow corre en windows-latest.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del sidecar
        working-directory: sidecar
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compilar el sidecar con PyInstaller (Windows)
        working-directory: sidecar
        # Usa nicos-sidecar.spec, NO una invocación cruda de pyinstaller --onefile
        # ...server.py -- ese comando regenera un spec por defecto con datas=[],
        # que es exactamente el bug encontrado y corregido en rc7 (migrations/*.sql
        # y provider_matrix.json nunca se empaquetan -> la tabla 'tasks' no se crea
        # nunca). El .spec ya versionado en el repo es la única fuente correcta.
        run: |
          pyinstaller nicos-sidecar.spec

      - name: Instalar dependencias de Electron
        run: npm install

      - name: Generar instalador .exe
        run: npx electron-builder --win

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NicOS-Desktop-Windows-Installer
          path: dist/*.exe
          retention-days: 30

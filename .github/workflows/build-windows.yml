name: Build Windows installer

# Se dispara manualmente o al pushear a main. Genera el paquete Operativa
# para Windows -- SIN Python, sin el sidecar. Windows nunca es Director (esa
# distinción ya existe en tiempo de ejecución en main.js/_bootAndLoad: "solo
# el rol Director levanta el sidecar Python"), así que este workflow no
# instala Python ni compila nada con PyInstaller -- ver rc10, donde se separó
# package.json build.win.extraResources del de Mac (antes copiaba, sin
# necesidad, el mismo sidecar/nicos-sidecar.exe + policies/ que Mac).
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Electron
        run: npm install

      - name: Generar staging sin empaquetar y verificar que no lleva el sidecar
        run: |
          npx electron-builder --win --dir
          node scripts/verify-win-package.js dist

      - name: Generar instalador .exe
        run: npx electron-builder --win

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NicOS-Desktop-Windows-Installer
          path: dist/*.exe
          retention-days: 30

name: Build Windows installer

# Se dispara manualmente, al pushear a main, o al pushear un tag de versión
# (v*) -- este último caso además PUBLICA el instalador como GitHub Release
# (ver v0.2.2: package.json build.win.publish + electron/auto-updater.js),
# que es lo que permite que las PC no-Director (Operativa, Enfermería de
# Abate) se auto-actualicen sin que Nicolás tenga que ir físicamente a
# instalarlo -- el flujo real es: Nicolás corre `git tag v0.2.2 && git push
# --tags` desde su Mac, este workflow compila y publica, y esas PCs detectan
# la versión nueva la próxima vez que la buscan (Ajustes -> Actualizaciones).
#
# Genera el paquete Operativa para Windows -- SIN Python, sin el sidecar.
# Windows nunca es Director (esa distinción ya existe en tiempo de ejecución
# en main.js/_bootAndLoad: "solo el rol Director levanta el sidecar Python"),
# así que este workflow no instala Python ni compila nada con PyInstaller --
# ver rc10, donde se separó package.json build.win.extraResources del de Mac
# (antes copiaba, sin necesidad, el mismo sidecar/nicos-sidecar.exe +
# policies/ que Mac).
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias de Electron
        run: npm install

      - name: Generar staging sin empaquetar y verificar que no lleva el sidecar
        run: |
          npx electron-builder --win --dir
          node scripts/verify-win-package.js dist

      - name: Generar instalador .exe
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npx electron-builder --win

      - name: Generar y publicar instalador .exe como Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      - name: Subir el instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: NicOS-Desktop-Windows-Installer
          path: dist/*.exe
          retention-days: 30
